<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programación Funcional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

   
</head>
<body>

<main class="container mt-5">

<div class="row text-center">

<article class="col-sm-4 mb-3">
   
    <div class="card">
          <div class="card-body">             
            <h5 class="card-title">Fresas 🍓</h5>
            <button class="btn btn-outline-primary" data-fruta="fresa">Agregar</button>
          </div>  
    </div>
</article>

<article class="col-sm-4 mb-3">
   
    <div class="card">
          <div class="card-body">             
            <h5 class="card-title">Uvas 🍇</h5>
            <button class="btn btn-outline-primary" data-fruta="uvas">Agregar</button>
          </div>  
    </div>
</article>

<article class="col-sm-4 mb-3">   
    <div class="card">
          <div class="card-body">             
            <h5 class="card-title">Melon 🍉</h5>
            <button class="btn btn-outline-primary" data-fruta="melon">Agregar</button>
          </div>  
    </div>
</article>

</div>
</main>

<section class="container mt-3">
    <ul class="list-group" id="carrito"></ul>
</section>

<template id="template">
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <span class="lead">Frutillas</span>
        <span class="badge bg-primary rounded-pill">12</span>
    </li>
</template>



<script src="js/app.js"></script>

</body>
</html>
